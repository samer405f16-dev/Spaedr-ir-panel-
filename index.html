<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spaedr ng</title>
<style>
:root{--bg:#0c1117;--panel:#141b24;--line:#243040;--ink:#e8eef6;--mute:#8a9bb0;--acc:#3ddcc4}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,system-ui,sans-serif;padding:24px 14px;display:flex;justify-content:center}
main{width:100%;max-width:440px;text-align:center}
h1{font-size:26px;margin:10px 0 6px}
.sub{color:var(--mute);font-size:13px;margin:0 0 24px;line-height:1.8}
button.main{width:100%;font:inherit;font-size:19px;font-weight:bold;cursor:pointer;border:0;border-radius:16px;padding:20px;color:#04201b;background:var(--acc)}
button.main:disabled{opacity:.6}
button:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
pre{direction:ltr;text-align:left;unicode-bidi:plaintext;background:#0a0f15;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:13px;white-space:pre-wrap;word-break:break-all;min-height:90px;margin:20px 0 12px;font-family:ui-monospace,Menlo,monospace}
a{display:none;text-decoration:none;color:var(--acc);border:1px solid var(--acc);border-radius:12px;padding:13px;margin-bottom:12px}
.off{font:inherit;font-size:13px;cursor:pointer;border-radius:10px;border:1px solid var(--line);padding:9px 14px;color:var(--mute);background:var(--panel)}
</style>
</head>
<body>
<main>
<h1>Spaedr ng</h1>
<p class="sub">ساخت پروکسی SOCKS5 برای تلگرام. تا وقتی پنجره‌ی ترموکس بسته نشده کار می‌کند.</p>
<button class="main" id="b" onclick="make()">ساخت پروکسی</button>
<pre id="o">برای شروع «ساخت پروکسی» را بزن</pre>
<a id="tg" href="#">افزودن به تلگرام</a>
<button class="off" onclick="off()">خاموش کردن</button>
</main>
<script>
const $=i=>document.getElementById(i);
let timer=null;
async function api(u,m){return (await fetch(u,{method:m||'GET'})).json()}
function show(s){$('o').textContent=s.t;if(s.tg){$('tg').href=s.tg;$('tg').style.display='block'}$('b').disabled=false}
async function make(){
  clearInterval(timer);$('tg').style.display='none';$('b').disabled=true;$('o').textContent='⏳ ...';
  try{const r=await api('/proxy','POST');$('o').textContent=r.t;
    if(!r.wait){$('b').disabled=false;return}
    let n=0;timer=setInterval(async()=>{n++;
      try{const s=await api('/status');if(s.done){clearInterval(timer);show(s)}else if(n>40){clearInterval(timer);$('o').textContent='❌ زمان تمام شد';$('b').disabled=false}}
      catch(e){clearInterval(timer);$('o').textContent='❌ ارتباط با ترموکس قطع شد';$('b').disabled=false}
    },3000);
  }catch(e){$('o').textContent='❌ ارتباط با ترموکس قطع شد. دستور spaedr را بزن.';$('b').disabled=false}
}
async function off(){clearInterval(timer);$('tg').style.display='none';try{const r=await api('/off','POST');$('o').textContent=r.t}catch(e){}$('b').disabled=false}
(async()=>{try{const s=await api('/status');if(s.done)show(s)}catch(e){}})();
</script>
</body>
</html>
