<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spaedr ir panel</title>
<style>
:root{--bg:#0c1117;--panel:#141b24;--line:#243040;--ink:#e8eef6;--mute:#8a9bb0;--acc:#3ddcc4}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,system-ui,sans-serif;padding:20px 14px;display:flex;justify-content:center}
main{width:100%;max-width:460px}
h1{font-size:24px;margin:6px 0 4px}
.sub{color:var(--mute);font-size:13px;margin:0 0 18px;line-height:1.8}
.row{display:flex;gap:10px;margin-bottom:16px}
button{flex:1;font:inherit;font-size:15px;cursor:pointer;border-radius:12px;border:1px solid var(--line);padding:14px 8px;color:var(--ink);background:var(--panel)}
button.m{background:var(--acc);color:#04201b;border-color:var(--acc);font-weight:bold}
button:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
pre{direction:ltr;text-align:left;unicode-bidi:plaintext;background:#0a0f15;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:12px;white-space:pre-wrap;word-break:break-all;min-height:70px;margin:0 0 12px;font-family:ui-monospace,Menlo,monospace}
a{display:none;text-align:center;text-decoration:none;color:var(--acc);border:1px solid var(--acc);border-radius:12px;padding:12px;margin-bottom:10px}
.cp{display:none;width:100%}
</style>
</head>
<body>
<main>
<h1>Spaedr ir panel</h1>
<p class="sub">پروکسی و کانفیگ SOCKS5. نیازی به کانفیگ نیست. تا وقتی پنجره‌ی ترموکس بسته نشده کار می‌کنند.</p>
<div class="row">
  <button class="m" onclick="go('/proxy')">ساخت پروکسی</button>
  <button class="m" onclick="go('/config')">ساخت کانفیگ</button>
  <button onclick="go('/off')">خاموش</button>
</div>
<pre id="o">برای شروع «ساخت پروکسی» را بزن</pre>
<a id="tg" href="#">افزودن به تلگرام</a>
<button class="cp" id="cp" onclick="copy()">کپی متن</button>
</main>
<script>
const $=i=>document.getElementById(i);
let timer=null;
async function post(u){return (await fetch(u,{method:'POST'})).json()}
function reset(){clearInterval(timer);$('tg').style.display='none';$('cp').style.display='none'}
async function go(u){
  reset();$('o').textContent='⏳ ...';
  try{
    const r=await post(u);$('o').textContent=r.t;
    if(u==='/config')$('cp').style.display='block';
    if(r.wait){let n=0;timer=setInterval(async()=>{
      n++;const s=await(await fetch('/status')).json();
      if(s.done){clearInterval(timer);$('o').textContent=s.t;if(s.tg){$('tg').href=s.tg;$('tg').style.display='block'}}
      else if(n>40){clearInterval(timer);$('o').textContent='❌ زمان تمام شد'}
    },3000)}
  }catch(e){$('o').textContent='❌ ارتباط با ترموکس قطع شد. دوباره panel را بزن.'}
}
async function copy(){
  try{await navigator.clipboard.writeText($('o').textContent);$('cp').textContent='کپی شد'}catch(e){}
  setTimeout(()=>$('cp').textContent='کپی متن',1500);
}
</script>
</body>
</html>
